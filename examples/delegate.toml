[[servers]]
name = "public"
protocol = "http"
listen = ":8080"
# Forwarded client addresses remain disabled unless both settings are enabled:
# client_ip_header = "X-Forwarded-For"
# trusted_proxies = ["127.0.0.1/32"]

[[mounts]]
path = "/*"
target = "http://127.0.0.1:9000/*"
server = "public"
protocol = "http"

[[policies]]
effect = "permit"
protocol = "http"
destination = "127.0.0.1"
source = "*"
