when:
  - event: push
  - event: pull_request
  - event: manual

steps:
  - name: test
    # Biggie uses Woodpecker's local backend: image is the executable that
    # interprets commands. The agent provides Go and the POSIX shell.
    image: sh
    commands:
      - test -z "$(sh scripts/ci-go.sh gofmt -l .)"
      - sh scripts/ci-go.sh go vet ./...
      - sh scripts/ci-go.sh go test ./...
      - CGO_ENABLED=1 sh scripts/ci-go.sh go test -race ./...

  - name: portable-builds
    image: sh
    depends_on: [test]
    commands:
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 sh scripts/ci-go.sh go build -o /tmp/delegate-darwin-arm64 ./cmd/delegate
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 sh scripts/ci-go.sh go build -o /tmp/delegate-linux-amd64 ./cmd/delegate
